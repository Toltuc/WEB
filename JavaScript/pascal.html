<!DOCTYPE html>

<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8" />
	<title>Треугольник Паскаля</title>
	<style>
		body, input, button { font-size:18px; }
		input { width:100px; }
		#triangle { overflow-x:auto; margin-top:16px; }
		.row { display:flex; justify-content:center; }
		.row span { min-width:3em; padding:4px 6px; text-align:center; font-family:monospace; }
	</style>
</head>
<body>
	<h1>Треугольник Паскаля</h1>

	<label for="rows">Количество строк: </label>
	<input type="number" id="rows" value="8" min="1">
	<input type="button" value="Построить" onclick="showPascal()">

	<div id="triangle"></div>

	<script>
		// Каждое число равно сумме двух чисел над ним; по краям стоят единицы.
		function showPascal()
		{
			let rows = Math.trunc(Number(document.getElementById("rows").value)) || 0;
			let container = document.getElementById("triangle");
			container.innerHTML = "";

			let row = [1n];
			for (let r = 0; r < rows; r++)
			{
				let line = document.createElement("div");
				line.className = "row";
				for (let value of row)
				{
					let cell = document.createElement("span");
					cell.textContent = value;
					line.appendChild(cell);
				}
				container.appendChild(line);

				let next = [1n];
				for (let i = 1; i < row.length; i++)
					next.push(row[i - 1] + row[i]);
				next.push(1n);
				row = next;
			}
		}
		showPascal();
	</script>
</body>
</html>
